name: CI Pipeline

on:
  push:
    branches: [ main ]
  # PR-uri pe main: rulează aceleași verificări (audit, scan-uri, RLS) înainte de merge,
  # astfel încât un review să poată vedea gate-urile verzi/roșii fără să fie nevoie de merge.
  pull_request:
    branches: [ main ]
  # Scan periodic de securitate (vulnerabilități de dependențe + secret scanning) pe main,
  # independent de activitatea de push. Cron "17 4 * * 1,4" = luni și joi, 04:17 UTC.
  # Minute/ore alese în afara celor rotunde (00/30) ca să evităm suprapunerea cu fluxurile
  # existente. Într-o rulare scheduled github.ref = refs/heads/main, iar niciun job nu citește
  # context de pull_request, deci contextul gol nu poate strica workflow-ul.
  schedule:
    - cron: '17 4 * * 1,4'

# Least-privilege: niciun job nu are nevoie de token cu drepturi de scriere
# (workflow-ul doar rulează verificări read-only pe cod). Dacă în viitor un job
# are nevoie de mai mult, se adaugă permisiv la nivel de job, nu global.
permissions:
  contents: read

# Concurrency: la un push nou pe main se anulează rulările anterioare ale
# aceluiași workflow (ultimul commit e cel care contează pe single-branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Backend lint + teste unitare
  # -----------------------------------------------------------------------
  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-nutritie-ai
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './backend-nutritie-ai/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Audit npm dependencies (moderate severity)
        run: npm audit --audit-level=moderate

      - name: Run Tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm test

  # -----------------------------------------------------------------------
  # Job 2: Teste de integrare RLS pe Postgres real (P-15)
  # -----------------------------------------------------------------------
  rls-integration:
    name: RLS Integration Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:15.6.1.143
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend-nutritie-ai
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './backend-nutritie-ai/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 15); do
            pg_isready -h localhost -p 54322 -U postgres && break
            echo "Waiting for Postgres... attempt $i"
            sleep 2
          done
          # Dacă niciuna din cele 15 încercări nu a reușit, eșuăm aici, rapid și clar,
          # în loc să lăsăm pașii următori (migrări / teste RLS) să dea erori confuze.
          pg_isready -h localhost -p 54322 -U postgres || exit 1

      - name: Apply Supabase Migrations
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          shopt -s nullglob
          fisiere=(../supabase/migrations/*.sql)
          if [ ${#fisiere[@]} -eq 0 ]; then
            echo "::error::Nicio migrare găsită"; exit 1
          fi
          for file in "${fisiere[@]}"; do
            echo "::group::$file"
            if ! out=$(psql "postgres://postgres:postgres@localhost:54322/postgres" -v ON_ERROR_STOP=1 -f "$file" 2>&1); then
              # C2-diagnostic: ongreesc eroarea exactă de SQL ca ANNOTATION GitHub,
              # citibilă prin API public fără token (logurile brute necesită auth).
              first_line=$(printf '%s\n' "$out" | grep -m1 -E 'ERROR|FATAL|psql:' || printf '%s\n' "$out" | head -1)
              echo "::error file=$file::MIGRARE ESCAPATA: $first_line"
              echo "$out"
              echo "::endgroup::"
              exit 1
            fi
            echo "$out"
            echo "::endgroup::"
          done

      # P-15: imaginile supabase/postgres pot varia în implementarea auth.uid().
      # O redefinim explicit în pasul de setup SQL (NU într-o migrare) ca testele
      # RLS să fie deterministe: auth.uid() = claim-ul 'sub' din request.jwt.
      # CREATE OR REPLACE e idempotent — acoperă și imaginea care o are deja.
      - name: Asigură auth.uid() (setup SQL, verificat de testele RLS)
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql "postgres://postgres:postgres@localhost:54322/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE
            AS $$
              SELECT COALESCE(
                NULLIF(current_setting('request.jwt.claim.sub', true), ''),
                (NULLIF(current_setting('request.jwt.claims', true), ''))::jsonb ->> 'sub'
              )::uuid;
            $$;
          SQL

      - name: Run RLS Integration Tests
        env:
          RLS_TESTS_REQUIRED: '1'
          INTEGRATION_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiJ9.ZopqoUt20nEV8rw6HtnRmV5wh-cGmWKSLzJH5U5E3QM'
          INTEGRATION_JWT_SECRET: 'super-secret-jwt-token-with-at-least-32-characters-long'
          INTEGRATION_DB_URL: 'postgres://postgres:postgres@localhost:54322/postgres'
        run: npm run test:integration

  # -----------------------------------------------------------------------
  # Job 3: Frontend typecheck + lint + audit + teste
  # -----------------------------------------------------------------------
  frontend-checks:
    name: Frontend Typecheck, Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-nutritie
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './frontend-nutritie/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Lint
        run: npm run lint

      # Gate de audit cu allowlist (scripts/auditGate.js): backlog-ul Expo SDK 54
      # (advisory-uri 2026-08-08 remediabile doar prin expo@57) e documentat si permis;
      # orice pachet NOU vulnerabil sau orice CRITICAL ramane blocant. La upgrade expo@57
      # se golesc ALLOWLIST-ul si osv-scanner.toml.
      - name: Audit npm dependencies (allowlist gate)
        run: npm run audit:gate

      - name: Run Frontend Tests (P-14)
        run: npm run test:ci

  # -----------------------------------------------------------------------
  # Job 4: Secret scanning (P-16)
  # -----------------------------------------------------------------------
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Scan for secrets with truffleHog
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          extra_args: --only-verified

  # -----------------------------------------------------------------------
  # Job 5: Scanare vulnerabilitati dependente (P-16)
  # -----------------------------------------------------------------------
  dep-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Scan lockfiles with osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --config=./osv-scanner.toml
            --lockfile=./backend-nutritie-ai/package-lock.json
            --lockfile=./frontend-nutritie/package-lock.json
            --lockfile=./tools/scratch_anatomy_svg/package-lock.json
