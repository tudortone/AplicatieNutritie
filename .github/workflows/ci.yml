name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Backend lint + teste unitare
  # -----------------------------------------------------------------------
  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-nutritie-ai
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './backend-nutritie-ai/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Audit npm dependencies (high severity)
        # P-16: eșec real la vulnerabilități high/critical
        run: npm audit --audit-level=high

      - name: Run Tests
        env:
          # P-16: fără fallback-uri dummy — dacă secretul lipsește, testul eșuează
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm test

  # -----------------------------------------------------------------------
  # Job 2: Teste de integrare RLS pe Postgres real (P-15)
  # P-15: acest job nu exista înainte — garanția centrală de securitate
  # nu era verificată automat de nimeni.
  # -----------------------------------------------------------------------
  rls-integration:
    name: RLS Integration Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:15.6.1.143
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend-nutritie-ai
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './backend-nutritie-ai/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 15); do
            pg_isready -h localhost -p 54322 -U postgres && break
            echo "Waiting for Postgres... attempt $i"
            sleep 2
          done

      - name: Apply Supabase Migrations
        env:
          PGPASSWORD: postgres
        run: |
          for file in ../supabase/migrations/*.sql; do
            echo "Applying $file..."
            psql -h localhost -p 54322 -U postgres -d postgres -f "$file"
          done

      - name: Run RLS Integration Tests
        env:
          RLS_TESTS_REQUIRED: '1'
          INTEGRATION_SUPABASE_URL: 'http://localhost:54321'
          INTEGRATION_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiJ9.ZopqoUt20nEV8rw6HtnRmV5wh-cGmWKSLzJH5U5E3QM'
          INTEGRATION_JWT_SECRET: 'super-secret-jwt-token-with-at-least-32-characters-long'
          INTEGRATION_DB_URL: 'postgres://postgres:postgres@localhost:54322/postgres'
        run: npm run test:integration

  # -----------------------------------------------------------------------
  # Job 3: Frontend typecheck + lint + teste
  # -----------------------------------------------------------------------
  frontend-checks:
    name: Frontend Typecheck, Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-nutritie
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './frontend-nutritie/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Lint
        run: npm run lint

      - name: Run Frontend Tests (P-14)
        run: npm test --if-present

  # -----------------------------------------------------------------------
  # Job 4: Secret scanning (P-16)
  # -----------------------------------------------------------------------
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with truffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # -----------------------------------------------------------------------
  # Job 5: Dependency review (P-16)
  # -----------------------------------------------------------------------
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
