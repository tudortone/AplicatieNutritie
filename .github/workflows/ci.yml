name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Backend lint + teste unitare
  # -----------------------------------------------------------------------
  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-nutritie-ai
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './backend-nutritie-ai/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Audit npm dependencies (high severity)
        run: npm audit --audit-level=high

      - name: Run Tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm test

  # -----------------------------------------------------------------------
  # Job 2: Teste de integrare RLS pe Postgres real (P-15)
  # -----------------------------------------------------------------------
  rls-integration:
    name: RLS Integration Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:15.6.1.143
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend-nutritie-ai
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './backend-nutritie-ai/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 15); do
            pg_isready -h localhost -p 54322 -U postgres && break
            echo "Waiting for Postgres... attempt $i"
            sleep 2
          done

      - name: Apply Supabase Migrations
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          shopt -s nullglob
          fisiere=(../supabase/migrations/*.sql)
          if [ ${#fisiere[@]} -eq 0 ]; then
            echo "::error::Nicio migrare găsită"; exit 1
          fi
          for file in "${fisiere[@]}"; do
            echo "::group::$file"
            psql "postgres://postgres:postgres@localhost:54322/postgres" -v ON_ERROR_STOP=1 -f "$file"
            echo "::endgroup::"
          done

      # P-15: imaginile supabase/postgres pot varia în implementarea auth.uid().
      # O redefinim explicit în pasul de setup SQL (NU într-o migrare) ca testele
      # RLS să fie deterministe: auth.uid() = claim-ul 'sub' din request.jwt.
      # CREATE OR REPLACE e idempotent — acoperă și imaginea care o are deja.
      - name: Asigură auth.uid() (setup SQL, verificat de testele RLS)
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql "postgres://postgres:postgres@localhost:54322/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE
            AS $$
              SELECT COALESCE(
                NULLIF(current_setting('request.jwt.claim.sub', true), ''),
                (NULLIF(current_setting('request.jwt.claims', true), ''))::jsonb ->> 'sub'
              )::uuid;
            $$;
          SQL

      - name: Run RLS Integration Tests
        env:
          RLS_TESTS_REQUIRED: '1'
          INTEGRATION_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiJ9.ZopqoUt20nEV8rw6HtnRmV5wh-cGmWKSLzJH5U5E3QM'
          INTEGRATION_JWT_SECRET: 'super-secret-jwt-token-with-at-least-32-characters-long'
          INTEGRATION_DB_URL: 'postgres://postgres:postgres@localhost:54322/postgres'
        run: npm run test:integration

  # -----------------------------------------------------------------------
  # Job 3: Frontend typecheck + lint + audit + teste
  # -----------------------------------------------------------------------
  frontend-checks:
    name: Frontend Typecheck, Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-nutritie
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './frontend-nutritie/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Lint
        run: npm run lint

      - name: Audit npm dependencies (high severity)
        run: npm audit --audit-level=high

      - name: Run Frontend Tests (P-14)
        run: npm run test:ci

  # -----------------------------------------------------------------------
  # Job 4: Secret scanning (P-16)
  # -----------------------------------------------------------------------
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with truffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  # -----------------------------------------------------------------------
  # Job 5: Scanare vulnerabilitati dependente (P-16)
  # -----------------------------------------------------------------------
  dep-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan lockfiles with osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            --lockfile=./backend-nutritie-ai/package-lock.json
            --lockfile=./frontend-nutritie/package-lock.json
