components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: JWT Supabase sau Clerk

  schemas:
    Error:
      type: object
      required: [eroare]
      properties:
        eroare: { type: string }
        cod: { type: string }
      additionalProperties: true
    ChatError:
      type: object
      required: [raspuns]
      properties:
        raspuns: { type: string }
      additionalProperties: false
    RootStatus:
      type: object
      required: [status, service, version, timestamp]
      properties:
        status: { type: string, const: OK }
        service: { type: string, const: NutriAI Secure Backend }
        version: { type: string, const: 2.5.0-audit }
        timestamp: { type: string, format: date-time }
    HealthStatus:
      type: object
      required: [status, healthy, uptime, timestamp]
      properties:
        status: { type: string, enum: [ok, degradat] }
        healthy: { type: boolean }
        uptime: { type: number, minimum: 0 }
        timestamp: { type: string, format: date-time }
    ProviderStatus:
      type: object
      required: [status, secundeRamase]
      properties:
        status:
          type: string
          enum: [active, disponibil, ok, cooldown, rate_limit, indisponibil]
        secundeRamase: { type: integer, minimum: 0, maximum: 3600 }
      additionalProperties: false
    AiStatusResponse:
      type: object
      required: [gemini, openai, groq, openrouter]
      properties:
        gemini: { $ref: '#/components/schemas/ProviderStatus' }
        openai: { $ref: '#/components/schemas/ProviderStatus' }
        groq: { $ref: '#/components/schemas/ProviderStatus' }
        openrouter: { $ref: '#/components/schemas/ProviderStatus' }
        rls: { type: object, description: Prezent numai pentru administratori. }
      additionalProperties: false
    ImageKitAuthResponse:
      type: object
      required: [token, expire, signature, urlEndpoint]
      properties:
        token: { type: string }
        expire: { type: integer }
        signature: { type: string }
        urlEndpoint: { type: string, format: uri }
    TriggerRequest:
      type: object
      required: [imageUrl]
      properties:
        imageUrl:
          type: string
          format: uri
          description: URL HTTPS ImageKit/Supabase din folderul `/mancare/<userId>/` al apelantului.
        tipMasa: { type: string, default: Pranz }
      additionalProperties: false
    TriggerResponse:
      type: object
      required: [jobId, succes, taskId, status, mesaj]
      properties:
        jobId: { type: [string, 'null'] }
        succes: { type: boolean, const: true }
        taskId: { type: string }
        status: { type: string, const: pending }
        mesaj: { type: string }
    PhotoRequest:
      type: object
      required: [imagine]
      properties:
        imagine: { type: string, format: binary, description: JPEG/PNG/WEBP, maximum 5 MB. }
        provider: { type: string, enum: [auto, gemini, openai, groq, openrouter], default: auto }
    AlimentAnalizat:
      type: object
      required: [nume, estimare_grame, calorii_per_100g, proteine_per_100g, grasimi_per_100g, carbohidrati_per_100g, incredere]
      properties:
        nume: { type: string }
        estimare_grame: { type: number }
        calorii_per_100g: { type: number }
        proteine_per_100g: { type: number }
        grasimi_per_100g: { type: number }
        carbohidrati_per_100g: { type: number }
        incredere: { type: string }
    ChatMessage:
      type: object
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        text: { type: string }
    ChatRequest:
      type: object
      anyOf:
        - required: [mesaj]
        - required: [mesaje]
      properties:
        mesaj: { type: string, maxLength: 500 }
        mesaje:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ChatMessage' }
        caloriiConsumate: { type: number }
        caloriiTinta: { type: number }
        proteineConsumate: { type: number }
        proteineTinta: { type: number }
    ChatResponse:
      type: object
      required: [raspuns]
      properties:
        raspuns: { type: string }
      additionalProperties: false
    LogFoodRequest:
      type: object
      required: [mesaj]
      properties:
        mesaj: { type: string, maxLength: 500 }
        mesaje:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/ChatMessage' }
    MealProposal:
      type: object
      properties:
        type: { type: string, const: MEAL_PROPOSAL }
        meal_type: { type: string, enum: [mic_dejun, pranz, cina, gustare] }
        items:
          type: array
          items: { $ref: '#/components/schemas/MealItem' }
        totals: { $ref: '#/components/schemas/MealTotals' }
      additionalProperties: true
    MealItem:
      type: object
      properties:
        name: { type: string }
        qty: { type: number }
        unit: { type: string }
        protein_g: { type: number }
        carbs_g: { type: number }
        fat_g: { type: number }
        kcal: { type: number }
        fiber_g: { type: number }
    MealTotals:
      type: object
      properties:
        protein_g: { type: number }
        carbs_g: { type: number }
        fat_g: { type: number }
        kcal: { type: number }
        fiber_g: { type: number }
    TextEstimateRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 200 }
      additionalProperties: false
    TextEstimateResponse:
      type: object
      required: [nume, calorii, proteine, carbohidrati, grasimi, gramajDefault]
      properties:
        nume: { type: string }
        calorii: { type: number }
        proteine: { type: number }
        carbohidrati: { type: number }
        grasimi: { type: number }
        gramajDefault: { type: number }
    ProfilNutritivRequest:
      type: object
      required: [aliment]
      properties:
        aliment: { type: string, maxLength: 200, pattern: '.*\p{L}.*' }
      additionalProperties: false
    ProfilNutritivResponse:
      type: object
      required: [nume, grame, calorii, proteine, carbohidrati, grasimi, fibre, aminoacizi, micronutrienti]
      properties:
        nume: { type: string }
        grame: { type: number, const: 100 }
        calorii: { type: number }
        proteine: { type: number }
        carbohidrati: { type: number }
        grasimi: { type: number }
        fibre: { type: number }
        aminoacizi: { type: object, additionalProperties: { type: number } }
        micronutrienti: { type: object, additionalProperties: { type: number } }
    VisionRequest:
      type: object
      anyOf:
        - required: [user_prompt]
        - required: [userExplanation]
      properties:
        user_prompt: { type: string, maxLength: 500 }
        userExplanation: { type: string, maxLength: 500, deprecated: true }
        current_ingredients: { type: array, maxItems: 50, items: { type: object } }
        imageIngredients: { type: array, maxItems: 50, items: { type: object }, deprecated: true }
    IngredientCorectat:
      type: object
      required: [nume, calorii_per_100g, proteine_per_100g, carbohidrati_per_100g, grasimi_per_100g, estimare_grame]
      properties:
        nume: { type: string }
        calorii_per_100g: { type: number }
        proteine_per_100g: { type: number }
        carbohidrati_per_100g: { type: number }
        grasimi_per_100g: { type: number }
        estimare_grame: { type: number }
    VisionResponse:
      type: object
      required: [action_taken, ingredients, new_totals]
      properties:
        action_taken: { type: string, enum: [replaced, appended] }
        ingredients: { type: array, items: { $ref: '#/components/schemas/IngredientCorectat' } }
        new_totals:
          type: object
          required: [kcal, proteine, grasimi, carbohidrati]
          properties:
            kcal: { type: number }
            proteine: { type: number }
            grasimi: { type: number }
            carbohidrati: { type: number }
    ProductSearchItem:
      type: object
      required: [code, product_name, brands, nutriments]
      properties:
        code: { type: string }
        product_name: { type: string }
        brands: { type: string }
        nutriments:
          type: object
          required: [energy-kcal_100g, proteins_100g, carbohydrates_100g, fat_100g]
          properties:
            energy-kcal_100g: { type: number }
            proteins_100g: { type: number }
            carbohydrates_100g: { type: number }
            fat_100g: { type: number }
    ProdusBarcode:
      type: object
      required: [codBare, nume, brand, cantitate, calorii, proteine, carbohidrati, grasimi]
      properties:
        codBare: { type: string }
        nume: { type: string }
        brand: { type: string }
        cantitate: { type: string }
        calorii: { type: number }
        proteine: { type: number }
        carbohidrati: { type: number }
        grasimi: { type: number }
        aminoacizi_100g: { type: [object, 'null'] }
        micronutrienti_100g: { type: [object, 'null'] }
        imagine_url: { type: [string, 'null'], format: uri }
    BarcodeResponse:
      type: object
      required: [produs, sursa, source, estimat, dinCache]
      properties:
        produs: { $ref: '#/components/schemas/ProdusBarcode' }
        sursa: { type: string, enum: [openfoodfacts, estimare_ai, user_manual, necunoscut] }
        source: { type: string, enum: [openfoodfacts, estimare_ai, user_manual, necunoscut] }
        estimat: { type: boolean }
        dinCache: { type: boolean }
    BarcodeSaveRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, pattern: '^[0-9]{4,20}$' }
        name: { type: string, maxLength: 150 }
        brand: { type: string, maxLength: 100 }
        quantity: { type: string, maxLength: 50 }
        kcal_100g: { type: number, minimum: 0, maximum: 1000 }
        protein_100g: { type: number, minimum: 0, maximum: 100 }
        carbs_100g: { type: number, minimum: 0, maximum: 100 }
        fat_100g: { type: number, minimum: 0, maximum: 100 }
      additionalProperties: false
    ProfilCalculationRequest:
      type: object
      required: [varsta, greutate, inaltime, sex, activitate, obiectiv]
      properties:
        varsta: { type: integer, minimum: 10, maximum: 100 }
        greutate: { type: number, minimum: 30, maximum: 300 }
        inaltime: { type: number, minimum: 100, maximum: 250 }
        sex: { type: string, enum: [Masculin, Feminin] }
        activitate: { type: string, enum: [Sedentar, Moderat, 'Foarte Activ'] }
        obiectiv: { type: string, enum: [Slăbire, Menținere, 'Masă Musculară'] }
      additionalProperties: false
    ProfilCalculationResponse:
      type: object
      required: [caloriiTinta, proteineTinta, grasimiTinta, carbiTinta]
      properties:
        caloriiTinta: { type: integer }
        proteineTinta: { type: integer }
        grasimiTinta: { type: integer }
        carbiTinta: { type: integer }
    AlimentMasaInput:
      type: object
      required: [nume, calorii]
      properties:
        nume: { type: string, maxLength: 150 }
        id: { type: string, maxLength: 500 }
        imageUrl: { type: string, maxLength: 500 }
        imageKitFileId: { type: string, maxLength: 500 }
        grame: { type: number, minimum: 0, maximum: 5000 }
        estimare_grame: { type: number, minimum: 0, maximum: 5000 }
        calorii: { type: number, minimum: 0, maximum: 10000 }
        proteine: { type: number, minimum: 0, maximum: 1000 }
        grasimi: { type: number, minimum: 0, maximum: 1000 }
        carbohidrati: { type: number, minimum: 0, maximum: 2000 }
        fibre: { type: number, minimum: 0, maximum: 1000 }
        calorii_per_100g: { type: number, minimum: 0, maximum: 1000 }
        proteine_per_100g: { type: number, minimum: 0, maximum: 100 }
        grasimi_per_100g: { type: number, minimum: 0, maximum: 100 }
        carbohidrati_per_100g: { type: number, minimum: 0, maximum: 100 }
        aminoacizi: { type: object, additionalProperties: { type: number } }
        micronutrienti: { type: object, additionalProperties: { type: number } }
      additionalProperties: false
    MasaFields:
      type: object
      properties:
        nume: { type: string, maxLength: 150 }
        nume_masa: { type: string, maxLength: 150, deprecated: true }
        calorii: { type: number, minimum: 0, maximum: 10000 }
        proteine: { type: number, minimum: 0, maximum: 1000 }
        grasimi: { type: number, minimum: 0, maximum: 1000 }
        carbohidrati: { type: number, minimum: 0, maximum: 2000 }
        fibre: { type: number, minimum: 0, maximum: 1000 }
        tip_masa: { type: string, enum: [mic_dejun, pranz, cina, gustare] }
        alimente: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AlimentMasaInput' } }
        data: { type: string }
        ora: { type: string }
      additionalProperties: false
    MasaCreateInput:
      allOf:
        - { $ref: '#/components/schemas/MasaFields' }
        - required: [calorii]
          anyOf:
            - required: [nume]
            - required: [nume_masa]
    MasaPatchInput:
      allOf:
        - { $ref: '#/components/schemas/MasaFields' }
        - minProperties: 1
    Masa:
      type: object
      required: [id, user_id, nume, calorii, proteine, grasimi, carbohidrati, fibre, tip_masa, alimente, data, ora]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string }
        nume: { type: string }
        calorii: { type: number }
        proteine: { type: number }
        grasimi: { type: number }
        carbohidrati: { type: number }
        fibre: { type: number }
        tip_masa: { type: string }
        alimente: { type: array, items: { type: object } }
        data: { type: [string, 'null'] }
        ora: { type: [string, 'null'] }
      additionalProperties: true
    UserProfilResponse:
      type: object
      required: [exista, complet, profil]
      properties:
        exista: { type: boolean }
        complet: { type: boolean }
        profil:
          type: [object, 'null']
          properties:
            varsta: { type: [number, 'null'] }
            greutate: { type: [number, 'null'] }
            inaltime: { type: [number, 'null'] }
            sex: { type: [string, 'null'] }
            activitate: { type: [string, 'null'] }
            obiectiv: { type: [string, 'null'] }
            caloriiTinta: { type: [number, 'null'] }
            proteineTinta: { type: [number, 'null'] }
            grasimiTinta: { type: [number, 'null'] }
            carbiTinta: { type: [number, 'null'] }
    PremiumStatusResponse:
      type: object
      required: [premium, isPremium, isTester, isAdmin, accessTier, hasFullAccess, productId, basePlanId, offerId, state, expiresDate, acknowledgementPending, isTestPurchase, validatServer]
      properties:
        premium: { type: boolean }
        isPremium: { type: boolean, description: Abonament Google Play verificat și persistent, încă valabil. }
        isTester: { type: boolean, description: Drept intern din app_metadata.full_access. }
        isAdmin: { type: boolean, description: Rol administrativ separat de accesul de tester. }
        accessTier: { type: string, enum: [free, tester, premium] }
        hasFullAccess: { type: boolean, description: Decizia comuna pentru portile de produs si reclame. }
        productId: { type: [string, 'null'] }
        basePlanId: { type: [string, 'null'] }
        offerId: { type: [string, 'null'] }
        state: { type: [string, 'null'] }
        expiresDate: { type: [string, 'null'], format: date-time }
        acknowledgementPending: { type: boolean }
        isTestPurchase: { type: boolean }
        validatServer: { type: boolean, const: true }
    GoogleBillingCatalogResponse:
      type: object
      required: [packageName, productIds]
      properties:
        packageName: { type: string, const: com.totsrl.getflo }
        productIds:
          type: array
          uniqueItems: true
          items: { type: string }
    GoogleBillingResyncResponse:
      allOf:
        - { $ref: '#/components/schemas/PremiumStatusResponse' }
        - type: object
          required: [restored]
          properties:
            restored: { type: integer, minimum: 0, maximum: 20 }
    GdprExportResponse:
      type: object
      required:
        - exportDate
        - user_id
        - user
        - profil
        - mese
        - antrenamente
        - produse_camara
        - gamificare
        - gamificare_evenimente
        - workout_logs
        - audit_log
        - estimari_barcode
        - ai_jobs
        - credite_ai
        - credite_tranzactii
        - abonamente_google_play
      properties:
        exportDate: { type: string, format: date-time }
        user_id: { type: string }
        user: { type: object }
        profil: { type: [object, 'null'] }
        mese: { type: array, items: { $ref: '#/components/schemas/Masa' } }
        antrenamente: { type: array, items: { type: object } }
        produse_camara: { type: array, items: { type: object } }
        gamificare: { type: array, items: { type: object } }
        gamificare_evenimente: { type: array, items: { type: object } }
        workout_logs: { type: array, items: { type: object } }
        audit_log: { type: array, items: { type: object } }
        estimari_barcode: { type: array, items: { type: object } }
        ai_jobs: { type: array, items: { type: object } }
        credite_ai: { type: array, items: { type: object } }
        credite_tranzactii: { type: array, items: { type: object } }
        abonamente_google_play:
          type: array
          description: Metadate de abonament; tokenurile brute și legăturile dintre tokenuri nu sunt exportate.
          items:
            type: object
            properties:
              purchase_token_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
              product_id: { type: string }
              base_plan_id: { type: [string, 'null'] }
              offer_id: { type: [string, 'null'] }
              subscription_state: { type: string }
              expiry_time: { type: [string, 'null'], format: date-time }
              acknowledgement_state: { type: string }
              is_entitled: { type: boolean }
              is_test_purchase: { type: boolean }
            additionalProperties: true
    WebhookAck:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        type: { type: string }
        eventType: { type: string }
        ignorat: { type: boolean }
        idempotent: { type: boolean }
        avertisment: { type: string }
        motiv: { type: string }
        soldNou: { type: number }
        crediteDelta: { type: number }
      additionalProperties: true

  responses:
    BadRequest:
      description: Cerere invalidă
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Token, semnătură sau secret lipsă/invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Operație refuzată
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resursă negăsită
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Identitate Clerk nemapată sau conflict de idempotență/proprietate
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BodyTooLarge:
      description: Corp peste limita acceptată
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Limită de rată, cotă AI sau cooldown atins
      headers:
        Retry-After: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UpstreamError:
      description: Furnizor extern indisponibil sau răspuns invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: Eroare internă
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: Serviciu, autentificare, cotă sau store temporar indisponibil
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  pathItems:
    AiStatus:
      get:
        summary: Stare publicabilă a furnizorilor AI
        description: Necesită bearer auth. Nu expune modele, tokeni, costuri sau mesaje interne; administratorii primesc opțional contoarele `rls`.
        responses:
          <<: *authLimited
          '200':
            description: Status curent
            content:
              application/json:
                schema: { $ref: '#/components/schemas/AiStatusResponse' }
          '500': { $ref: '#/components/responses/ServerError' }
    ImageKitAuth:
      get:
        summary: Parametri de autentificare ImageKit
        responses:
          <<: *authLimited
          '200':
            description: Parametri upload direct
            content:
              application/json:
                schema: { $ref: '#/components/schemas/ImageKitAuthResponse' }
          '500': { $ref: '#/components/responses/ServerError' }
    TriggerAnaliza:
      post:
        summary: Programează analiza AI în Trigger.dev
        parameters:
          - $ref: '#/components/parameters/IdempotencyKey'
        requestBody:
          required: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggerRequest' }
        responses:
          <<: *jsonMutation
          '202':
            description: Job acceptat pentru procesare asincronă
            content:
              application/json:
                schema: { $ref: '#/components/schemas/TriggerResponse' }
    AnalizaFoto:
      post:
        summary: Analiză AI a unei fotografii
        parameters:
          - $ref: '#/components/parameters/IdempotencyKey'
          - $ref: '#/components/parameters/PayloadFingerprint'
          - in: query
            name: provider
            required: false
            schema: { type: string, enum: [auto, gemini, openai, groq, openrouter] }
        requestBody:
          required: true
          content:
            multipart/form-data:
              schema: { $ref: '#/components/schemas/PhotoRequest' }
        responses:
          <<: *jsonMutation
          '200':
            description: Alimente normalizate
            content:
              application/json:
                schema:
                  type: array
                  items: { $ref: '#/components/schemas/AlimentAnalizat' }
          '499':
            description: Clientul s-a deconectat înainte de răspuns
    Chat:
      post:
        summary: Chat nutrițional AI
        parameters:
          - $ref: '#/components/parameters/IdempotencyKey'
        requestBody:
          required: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatRequest' }
        responses:
          <<: *jsonMutation
          '200':
            description: Răspuns AI
            content:
              application/json:
                schema: { $ref: '#/components/schemas/ChatResponse' }
          '400':
            description: Validare handler sau middleware
            content:
              application/json:
                schema:
                  oneOf:
                    - { $ref: '#/components/schemas/ChatError' }
                    - { $ref: '#/components/schemas/Error' }
          '500':
            description: Eroare handler sau globală
            content:
              application/json:
                schema:
                  oneOf:
                    - { $ref: '#/components/schemas/ChatError' }
                    - { $ref: '#/components/schemas/Error' }
    LogFoodChat:
      post:
        summary: Generează MEAL_PROPOSAL din conversație
        parameters:
          - $ref: '#/components/parameters/IdempotencyKey'
        requestBody:
          required: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogFoodRequest' }
        responses:
          <<: *jsonMutation
          '200':
            description: Propunere de masă
            content:
              application/json:
                schema: { $ref: '#/components/schemas/MealProposal' }
    EstimeazaMancareText:
      post:
        summary: Estimează o porție din text
        parameters:
          - $ref: '#/components/parameters/IdempotencyKey'
        requestBody:
          required: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TextEstimateRequest' }
        responses:
          <<: *jsonMutation
          '200':
            description: Estimare nutrițională
            content:
              application/json:
                schema: { $ref: '#/components/schemas/TextEstimateResponse' }
    ProfilNutritiv:
      post:
        summary: Generează profilul nutrițional per 100 g
        parameters:
          - $ref: '#/components/parameters/IdempotencyKey'
        requestBody:
          required: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfilNutritivRequest' }
        responses:
          <<: *jsonMutation
          '200':
            description: Profil nutrițional normalizat
            content:
              application/json:
                schema: { $ref: '#/components/schemas/ProfilNutritivResponse' }
    VisionFallback:
      post:
        summary: Corectează/unește ingredientele folosind explicație text
        parameters:
          - $ref: '#/components/parameters/IdempotencyKey'
        requestBody:
          required: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisionRequest' }
        responses:
          <<: *jsonMutation
          '200':
            description: Ingrediente corectate și totaluri recalculate
            content:
              application/json:
                schema: { $ref: '#/components/schemas/VisionResponse' }
    CautaProdus:
      get:
        summary: Caută produse în OpenFoodFacts
        parameters:
          - in: query
            name: q
            required: true
            schema: { type: string, minLength: 2, maxLength: 80 }
        responses:
          <<: *authLimited
          '200':
            description: Maximum 20 rezultate normalizate
            content:
              application/json:
                schema:
                  type: array
                  maxItems: 20
                  items: { $ref: '#/components/schemas/ProductSearchItem' }
          '400': { $ref: '#/components/responses/BadRequest' }
          '502': { $ref: '#/components/responses/UpstreamError' }
    ProdusBarcode:
      get:
        summary: Caută produs după cod de bare
        description: >-
          Lookup-urile din cache-ul public de produse și din estimările proprii sunt
          gratuite. Doar un MISS avansează la fallback-ul AI, care consumă cotă/credite.
          P1-12: pe MISS, fallback-ul AI este protejat de un zălog atomic partajat,
          scopat pe (utilizator autentificat, cod de bare canonic). Codul se tratează ca
          șir — zerourile din față sunt semnificative (`00012345` ≠ `12345`).
          O singură operație logică produce cel mult un apel la furnizor și cel mult o
          debitare, inclusiv când cereri duplicate sosesc simultan pe cache rece.
        parameters:
          - in: path
            name: code
            required: true
            schema: { type: string, pattern: '^[0-9]{4,20}$' }
        responses:
          <<: *authLimited
          '200':
            description: Produs și proveniență
            content:
              application/json:
                schema: { $ref: '#/components/schemas/BarcodeResponse' }
          '400': { $ref: '#/components/responses/BadRequest' }
          '409':
            description: >-
              O estimare AI pentru același cod de bare și același utilizator este deja
              în curs. Duplicatul NU apelează furnizorul și NU consumă cotă/credite.
              Serverul așteaptă mărginit (maximum ~4s) rezultatul deținătorului; dacă
              acesta nu este disponibil până atunci, răspunde retryable cu `Retry-After`.
            headers:
              Retry-After:
                schema: { type: string }
                description: Secunde recomandate până la reluare.
            content:
              application/json:
                schema:
                  type: object
                  required: [eroare, cod]
                  properties:
                    eroare: { type: string }
                    cod: { type: string, const: BARCODE_AI_IN_PROGRESS }
          '503':
            description: >-
              Stocul partajat de zăloguri este indisponibil. Fail-closed deliberat:
              fără garanția de at-most-once, fallback-ul AI nu se execută neprotejat.
            content:
              application/json:
                schema:
                  type: object
                  required: [eroare, cod]
                  properties:
                    eroare: { type: string }
                    cod: { type: string, const: IDEMPOTENCY_STORE_UNAVAILABLE }
          '404':
            description: Produs negăsit; se permite introducerea manuală
            content:
              application/json:
                schema:
                  type: object
                  required: [eroare, allowManualEntry, suggestedAction]
                  properties:
                    eroare: { type: string }
                    allowManualEntry: { type: boolean, const: true }
                    suggestedAction: { type: string, const: manual_or_ai_text }
          '500': { $ref: '#/components/responses/ServerError' }
    SalveazaProdusBarcode:
      post:
        summary: Salvează un produs completat manual
        parameters:
          - $ref: '#/components/parameters/IdempotencyKey'
        requestBody:
          required: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BarcodeSaveRequest' }
        responses:
          <<: *jsonMutation
          '200':
            description: Produs salvat
            content:
              application/json:
                schema:
                  type: object
                  required: [succes, message]
                  properties:
                    succes: { type: boolean, const: true }
                    message: { type: string }
          '403': { $ref: '#/components/responses/Forbidden' }
    CalculeazaProfil:
      post:
        summary: Calculează determinist țintele nutriționale
        parameters:
          - $ref: '#/components/parameters/IdempotencyKey'
        requestBody:
          required: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfilCalculationRequest' }
        responses:
          <<: *jsonMutation
          '200':
            description: Ținte calculate
            content:
              application/json:
                schema: { $ref: '#/components/schemas/ProfilCalculationResponse' }
    Mese:
      post:
        summary: Adaugă o masă în jurnal
        parameters:
          - $ref: '#/components/parameters/IdempotencyKey'
        requestBody:
          required: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasaCreateInput' }
        responses:
          <<: *jsonMutation
          '200':
            description: Masă creată
            content:
              application/json:
                schema:
                  type: object
                  required: [succes, masa]
                  properties:
                    succes: { type: boolean, const: true }
                    masa:
                      oneOf:
                        - { $ref: '#/components/schemas/Masa' }
                        - { type: 'null' }
    MasaId:
      put:
        summary: Actualizează parțial o masă
        parameters:
          - $ref: '#/components/parameters/MasaId'
        requestBody:
          required: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasaPatchInput' }
        responses:
          <<: *jsonMutation
          '200':
            description: Masă actualizată
            content:
              application/json:
                schema:
                  type: object
                  required: [succes, masa]
                  properties:
                    succes: { type: boolean, const: true }
                    masa: { $ref: '#/components/schemas/Masa' }
          '404': { $ref: '#/components/responses/NotFound' }
      delete:
        summary: Șterge o masă
        parameters:
          - $ref: '#/components/parameters/MasaId'
        responses:
          <<: *authLimited
          '200':
            description: Masă ștearsă
            content:
              application/json:
                schema:
                  type: object
                  required: [succes]
                  properties:
                    succes: { type: boolean, const: true }
          '400': { $ref: '#/components/responses/BadRequest' }
          '404': { $ref: '#/components/responses/NotFound' }
          '500': { $ref: '#/components/responses/ServerError' }
    UserProfil:
      get:
        summary: Citește completitudinea profilului
        responses:
          <<: *authLimited
          '200':
            description: Profil și indicatori de completitudine
            content:
              application/json:
                schema: { $ref: '#/components/schemas/UserProfilResponse' }
    PremiumStatus:
      get:
        summary: Citește entitlement-ul Google Play persistent și autoritativ
        responses:
          <<: *authLimited
          '200':
            description: Status premium validat
            content:
              application/json:
                schema: { $ref: '#/components/schemas/PremiumStatusResponse' }
    GoogleBillingProducts:
      get:
        summary: Returnează catalogul Google Play permis de backend
        responses:
          <<: *authLimited
          '200':
            description: Package și allowlist de abonamente, fără secrete
            content:
              application/json:
                schema: { $ref: '#/components/schemas/GoogleBillingCatalogResponse' }
    GoogleBillingVerify:
      post:
        summary: Verifică un purchase token prin Google Play Developer API
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [purchaseToken]
                properties:
                  purchaseToken: { type: string, minLength: 20, maxLength: 4096, writeOnly: true }
                additionalProperties: false
        responses:
          <<: *authLimited
          '200':
            description: Verdict persistent server-authoritative
            content:
              application/json:
                schema: { $ref: '#/components/schemas/PremiumStatusResponse' }
          '400': { $ref: '#/components/responses/BadRequest' }
          '403': { $ref: '#/components/responses/Forbidden' }
          '413': { $ref: '#/components/responses/BodyTooLarge' }
    GoogleBillingResync:
      post:
        summary: Re-verifică achizițiile curente raportate de Google Play
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [purchaseTokens]
                properties:
                  purchaseTokens:
                    type: array
                    maxItems: 20
                    uniqueItems: true
                    items: { type: string, minLength: 20, maxLength: 4096, writeOnly: true }
                additionalProperties: false
        responses:
          <<: *authLimited
          '200':
            description: Entitlement curent după re-verificare
            content:
              application/json:
                schema: { $ref: '#/components/schemas/GoogleBillingResyncResponse' }
          '400': { $ref: '#/components/responses/BadRequest' }
