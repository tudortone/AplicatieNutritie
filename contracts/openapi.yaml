          '413': { $ref: '#/components/responses/BodyTooLarge' }
          '429': { $ref: '#/components/responses/RateLimited' }
          '503': { $ref: '#/components/responses/ServiceUnavailable' }

  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, maxLength: 200, pattern: '^[\x21-\x7e]+$' }
      description: >-
        Identifică OPERAȚIA LOGICĂ, nu cererea HTTP: clientul o generează o dată la
        începutul acțiunii și o refolosește identic la fiecare retry de transport.
        Cheia este scopată pe utilizatorul autentificat — aceeași valoare la doi
        utilizatori nu se ciocnește și nu expune rezultatul celuilalt.
        Replay al unei operații încheiate cu succes returnează rezultatul înregistrat
        (antet `Idempotency-Status: replayed`), fără reapelarea furnizorului AI și
        fără a doua debitare de credit/cotă.
        Refolosirea cu alt payload → 409 `IDEMPOTENCY_KEY_REUSED`.
        Cerere încă în curs cu aceeași cheie → 409 `IDEMPOTENCY_IN_PROGRESS` + `Retry-After`.
        P1-12 — MOD DE COMPATIBILITATE: dacă antetul lipsește pe o rută AI critică cu
        corp JSON, serverul DERIVĂ o cheie mai slabă din (utilizator, rută, amprenta
        corpului), cu TTL scurt (90s), suficient cât să absoarbă retry-urile de
        transport fără a schimba semantica repetărilor deliberate. Pe cererile
        multipart derivarea nu este posibilă fără `X-Payload-Fingerprint`, deci acolo
        protecția depinde de client.
    PayloadFingerprint:
      in: header
      name: X-Payload-Fingerprint
      required: false
      schema: { type: string, pattern: '^[0-9a-f]{64}$' }
      description: >-
        SHA-256 hex (64 caractere) al conținutului cererii. Obligatoriu în practică pe
        rutele multipart: corpul nu este parsat încă la momentul verificării de
        idempotență, deci fără această amprentă serverul nu poate distinge două imagini
        diferite trimise cu aceeași cheie și ar returna tăcut rezultatul primei analize.
        Format invalid → 400 `AMPRENTA_INVALIDA`.
    MasaId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
