openapi: 3.1.0
info:
  title: NutriAI Backend API
  version: 2.5.0-audit
  description: |
    Contractul HTTP al backendului NutriAI. Prefixul canonic este `/api/v1`.
    Aliasurile `/api` rămân disponibile temporar și sunt marcate prin
    `x-legacy-alias`, cu sunset la 2026-09-30.

    Rutele API normale folosesc `Authorization: Bearer <token>` (Supabase sau
    Clerk). Webhook-urile folosesc semnătura/secretul furnizorului și nu folosesc
    bearer auth. Majoritatea erorilor au forma `{ "eroare": string }`; ruta chat
    păstrează și forma istorică `{ "raspuns": string }` pentru erorile handlerului.
servers:
  - url: https://nutritie-backend-ai.onrender.com
    description: Producție (Render)
  - url: http://localhost:3000
    description: Dezvoltare locală
security:
  - bearerAuth: []

# Seturi YAML folosite doar pentru a evita repetarea statusurilor de middleware.
# După parsare, fiecare operație conține explicit toate cheile de răspuns.
x-response-sets:
  auth-limited: &authLimited
    '401': { $ref: '#/components/responses/Unauthorized' }
    '409': { $ref: '#/components/responses/Conflict' }
    '429': { $ref: '#/components/responses/RateLimited' }
    '503': { $ref: '#/components/responses/ServiceUnavailable' }
  json-mutation: &jsonMutation
    '400': { $ref: '#/components/responses/BadRequest' }
    '401': { $ref: '#/components/responses/Unauthorized' }
    '409': { $ref: '#/components/responses/Conflict' }
    '413': { $ref: '#/components/responses/BodyTooLarge' }
    '429': { $ref: '#/components/responses/RateLimited' }
    '500': { $ref: '#/components/responses/ServerError' }
    '503': { $ref: '#/components/responses/ServiceUnavailable' }
  webhook: &webhookResponses
    '400': { $ref: '#/components/responses/BadRequest' }
    '401': { $ref: '#/components/responses/Unauthorized' }
    '429': { $ref: '#/components/responses/RateLimited' }
    '500': { $ref: '#/components/responses/ServerError' }

paths:
  /:
    get:
      summary: Stare serviciu
      security: []
      responses:
        '200':
          description: Serviciu funcțional
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RootStatus' }
  /health:
    get:
      summary: Readiness check Supabase
      security: []
      responses:
        '200':
          description: Backend și Supabase disponibile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: Supabase indisponibil; backend degradat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }

  # Suprafața canonică /api/v1.
  /api/v1/ai-status: { $ref: '#/components/pathItems/AiStatus' }
  /api/v1/imagekit-auth: { $ref: '#/components/pathItems/ImageKitAuth' }
  /api/v1/trigger-analiza-mancare: { $ref: '#/components/pathItems/TriggerAnaliza' }
  /api/v1/analiza-foto: { $ref: '#/components/pathItems/AnalizaFoto' }
  /api/v1/analizeaza-mancare-structurat: { $ref: '#/components/pathItems/AnalizaFoto' }
  /api/v1/chat: { $ref: '#/components/pathItems/Chat' }
  /api/v1/log-food-from-chat: { $ref: '#/components/pathItems/LogFoodChat' }
  /api/v1/log-food: { $ref: '#/components/pathItems/LogFoodChat' }
  /api/v1/log-food-chat: { $ref: '#/components/pathItems/LogFoodChat' }
  /api/v1/estimeaza-mancare-text: { $ref: '#/components/pathItems/EstimeazaMancareText' }
  /api/v1/profil-nutritiv: { $ref: '#/components/pathItems/ProfilNutritiv' }
  /api/v1/vision-fallback: { $ref: '#/components/pathItems/VisionFallback' }
  /api/v1/corecteaza-mancare-vizual-text: { $ref: '#/components/pathItems/VisionFallback' }
  /api/v1/cauta-produs: { $ref: '#/components/pathItems/CautaProdus' }
  /api/v1/produs-barcode/{code}: { $ref: '#/components/pathItems/ProdusBarcode' }
  /api/v1/salveaza-produs-barcode: { $ref: '#/components/pathItems/SalveazaProdusBarcode' }
  /api/v1/calculeaza-profil: { $ref: '#/components/pathItems/CalculeazaProfil' }
  /api/v1/mese: { $ref: '#/components/pathItems/Mese' }
  /api/v1/mese/{id}: { $ref: '#/components/pathItems/MasaId' }
  /api/v1/user/profil: { $ref: '#/components/pathItems/UserProfil' }
  /api/v1/user/premium-status: { $ref: '#/components/pathItems/PremiumStatus' }
  /api/v1/billing/google/products: { $ref: '#/components/pathItems/GoogleBillingProducts' }
  /api/v1/billing/google/verify: { $ref: '#/components/pathItems/GoogleBillingVerify' }
  /api/v1/billing/google/resync: { $ref: '#/components/pathItems/GoogleBillingResync' }
  /api/v1/billing/google/verify-consumable: { $ref: '#/components/pathItems/GoogleBillingVerifyConsumable' }
  /api/v1/flow-credits: { $ref: '#/components/pathItems/FlowCredits' }
  /api/v1/photo-jobs: { $ref: '#/components/pathItems/PhotoJobs' }
  /api/v1/photo-jobs/active: { $ref: '#/components/pathItems/PhotoJobsActive' }
  /api/v1/photo-jobs/{jobId}: { $ref: '#/components/pathItems/PhotoJobId' }
  /api/v1/photo-assets/cleanup: { $ref: '#/components/pathItems/PhotoAssetCleanup' }
  /api/v1/rewarded/intents: { $ref: '#/components/pathItems/RewardedIntent' }
  /api/v1/webhooks/admob/rewarded: { $ref: '#/components/pathItems/AdmobRewardedWebhook' }
  /api/v1/user/export-data: { $ref: '#/components/pathItems/ExportData' }
  /api/v1/user/delete-account: { $ref: '#/components/pathItems/DeleteAccount' }
  /api/v1/webhooks/clerk: { $ref: '#/components/pathItems/ClerkWebhook' }
  /api/v1/webhooks/google-play: { $ref: '#/components/pathItems/GooglePlayWebhook' }

