# osv-scanner — config de ignorare (https://google.github.io/osv-scanner/configuration/)
#
# Aplicatia e pe Expo SDK 54 (expo ~54.0.34, react-native 0.81.5). Toate advisory-urile
# din 2026-08-08 pentru lantul Expo (`@expo/*`, `metro`, `expo-*`, `react-native` etc.)
# au ca singura remediere un upgrade MAJOR la Expo SDK 57. Nu exista versiune "patched"
# in SDK 54, iar un override pe un sub-pachet Expo rupe prebuild/bundler-ul.
#
# Acest backlog e urmarit ca upgrade separat (expo@57). Orice vulnerabilitate NOUA
# intr-un pachet care NU e listat mai jos (sau un CRITICAL) ramane blocanta pentru CI.
# Cand trecem la expo@57, se sterge intreaga lista de mai jos.

[[PackageOverrides]]
name = "@expo/cli"
vulnerability.ignore = true
reason = "Backlog Expo SDK 54 -> upgrade expo@57"

[[PackageOverrides]]
name = "@expo/config"
vulnerability.ignore = true
reason = "Backlog Expo SDK 54 -> upgrade expo@57"

