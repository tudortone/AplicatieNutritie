# Configurație locală generată după schema Supabase CLI 2.115.0.
# Necesită Docker; nu conține chei sau identificatorul proiectului cloud.
project_id = "nutriai-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
# Aliniat cu imaginea verificată în CI: supabase/postgres:15.6.1.143.
major_version = 15

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# Repository-ul nu are date seed necesare; testele își creează tranzacțional datele.
enabled = false
sql_paths = []

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["nutriai://**", "http://127.0.0.1:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
