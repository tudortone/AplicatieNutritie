<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Scene 1: Scan Reveal (12s)</title>
  <style>
    :root {
      --bg: #090C0E;
      --accent: #CCFF00;
      --accent-glow: rgba(204, 255, 0, 0.4);
      --protein: #00E5FF;
      --carbs: #A855F7;
      --fat: #F59E0B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: #FFF;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 100px 80px;
      position: relative;
    }
    .grid-bg {
      position: absolute;
      inset: 0;
      background-size: 60px 60px;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 5;
    }
    .logo {
      font-size: 2.8rem;
      font-weight: 900;
    }
    .logo span { color: var(--accent); }
    .badge {
      background: rgba(204, 255, 0, 0.15);
      border: 2px solid var(--accent);
      color: var(--accent);
      padding: 12px 28px;
      border-radius: 9999px;
      font-size: 1.3rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .main-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 5;
    }
    .hook-text {
      font-size: 5.2rem;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.04em;
    }
    .strike-line {
      position: relative;
      display: inline-block;
    }
    .strike-line::after {
      content: '';
      position: absolute;
      left: -10px;
      right: -10px;
      top: 55%;
      height: 10px;
      background: var(--accent);
      box-shadow: 0 0 25px var(--accent);
      animation: strikeAnim 0.6s ease-out 1.5s forwards;
      transform: scaleX(0);
      transform-origin: left;
    }
    @keyframes strikeAnim {
      to { transform: scaleX(1); }
    }

    .card-reveal {
      width: 100%;
      margin-top: 60px;
      opacity: 0;
      transform: translateY(50px);
      animation: revealCard 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.8s forwards;
    }
    @keyframes revealCard {
      to { opacity: 1; transform: translateY(0); }
    }

    .split-card {
      background: #121820;
      border: 3px solid var(--accent);
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 0 100px var(--accent-glow);
    }
    .plate-photo {
      height: 520px;
      background: radial-gradient(circle at center, #273646 0%, #0F161E 100%);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .scan-beam {
      position: absolute;
      left: 0;
      right: 0;
      height: 8px;
      background: var(--accent);
      box-shadow: 0 0 35px 8px var(--accent);
      animation: sweepAnim 2.5s infinite ease-in-out;
    }
    @keyframes sweepAnim {
      0%, 100% { top: 10%; }
      50% { top: 90%; }
    }
    .timer-tag {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background: rgba(9, 12, 14, 0.9);
      border: 2px solid var(--accent);
      color: var(--accent);
      font-size: 1.5rem;
      font-weight: 900;
      padding: 12px 24px;
      border-radius: 16px;
    }

    .footer {
      display: flex;
      justify-content: center;
      position: relative;
      z-index: 5;
    }
    .cta-btn {
      background: var(--accent);
      color: #090C0E;
      font-size: 2.2rem;
      font-weight: 900;
      padding: 24px 64px;
      border-radius: 9999px;
      box-shadow: 0 10px 50px var(--accent-glow);
      opacity: 0;
      transform: scale(0.9);
      animation: popCta 0.6s ease-out 6.5s forwards;
    }
    @keyframes popCta {
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="header">
    <div class="logo">Get<span>Flow</span></div>
    <div class="badge">Viteză AI • 60 FPS</div>
  </div>

  <div class="main-stage">
    <div class="hook-text">
      Încă mai cântărești<br>
      <span class="strike-line">mâncarea manual?</span>
    </div>

    <div class="card-reveal">
      <div class="split-card">
        <div class="plate-photo">
          <div class="scan-beam"></div>
          <div style="width:340px; height:340px; border-radius:50%; background:#1A242F; border:4px solid rgba(255,255,255,0.15);"></div>
          <div class="timer-tag">⚡ 1.4 SECUNDE</div>
        </div>
        <div style="padding: 40px; text-align: left; background: #18202A;">
          <div style="font-size: 2.2rem; font-weight: 900; color: #FFF;">Piept de pui cu orez basmati</div>
          <div style="font-size: 4rem; font-weight: 900; color: var(--accent); margin-top: 10px;">640 kcal</div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="cta-btn">Instalează GetFlow pe Google Play</div>
  </div>
</body>
</html>
